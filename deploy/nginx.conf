# Included inside Nginx's http context (the Docker image uses conf.d/).
# Only this restricted alphabet may be interpolated into a JavaScript string.
map $http_accept_language $law_accept_language {
    default "";
    "~^[A-Za-z0-9,;=.* _-]{0,512}\\z" $http_accept_language;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location = /browser-language.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept-Language" always;
        return 200 "window.LAW_ACCEPT_LANGUAGE = '$law_accept_language';\n";
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
